[tool.poetry]
name = "network"
version = "0.1.0"
description = ""
authors = ["svetlana-kolesnikova <sv.ps1286@gmail.com>"]

package-mode = false

readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
django = ">=5.0,<6.0"
djangorestframework = ">=3.16.1,<4.0.0"
psycopg2 = ">=2.9.11,<3.0.0"
python-dotenv = ">=1.2.1,<2.0.0"
requests = "^2.32.5"
django-filter = "^25.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.12.0"
isort = "^7.0.0"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.git          # Исключить несколько общих каталогов
                     # в корне проекта
  )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.coverage.report]
# исключение для покрытия тестами
exclude_also = ["config/asgi.py", "config/wsgi.py"]